<style>
/* Quotient Rings: pick a base ring, type f, see R[x]/(f) split into pieces by the Chinese Remainder Theorem. */
:root{
  color-scheme: light;
  --bg:#f5f3ee; --panel:#ffffff; --soft:#f0ede6; --line:#ddd8cb;
  --fg:#1c2430; --muted:#5b6676; --accent:#2b5fd9; --on-accent:#fff;
  --teal:#13897c; --purple:#7048c4; --coral:#d8553b;
  --u:#2f9e5f; --zd:#d99a14; --nil:#d24433; --zero:#8c95a1;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101318; --panel:#181d24; --soft:#212831; --line:#2f3743;
    --fg:#e8ecf2; --muted:#9ba7b8; --accent:#7aa2ff; --on-accent:#0c1220;
    --teal:#3cc4b3; --purple:#a58cf2; --coral:#f48a70;
    --u:#4cc27f; --zd:#ecb94a; --nil:#f06b59; --zero:#6e7987;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101318; --panel:#181d24; --soft:#212831; --line:#2f3743;
  --fg:#e8ecf2; --muted:#9ba7b8; --accent:#7aa2ff; --on-accent:#0c1220;
  --teal:#3cc4b3; --purple:#a58cf2; --coral:#f48a70;
  --u:#4cc27f; --zd:#ecb94a; --nil:#f06b59; --zero:#6e7987;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-body);overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 56px}
h1{font:600 clamp(30px,6vw,46px)/1.05 var(--font-display);margin:0 0 8px;letter-spacing:-.01em}
h2{font:600 19px/1.2 var(--font-display);margin:0 0 12px}
.lede{margin:0 0 20px;color:var(--muted);max-width:60ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;min-width:0}
sub,sup{line-height:0;font-size:.72em}
.mono,.poly{font-family:var(--font-mono)}
.poly{font-size:.95em;letter-spacing:-.01em}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;padding:8px 16px;font-size:16px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 8px;min-height:40px}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fline{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:18px}
.fline .pre{white-space:nowrap}
.fline input{flex:1;min-width:0;font-family:var(--font-mono);font-size:16px}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.keys button,.presets button{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 12px;min-height:34px;font-size:14px}
.keys button{font-family:var(--font-mono);min-width:36px}
.keys button:hover,.presets button:hover{border-color:var(--accent)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.presets .lab{font-size:13px;color:var(--muted);margin-right:2px}
.presets button .poly{font-size:13px}
.presets button small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.err{color:var(--nil);min-height:0;font-size:14px;margin-top:8px}
.err:empty{display:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0 16px}
@media (min-width:900px){ .layout.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} }
.ringbox{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 16px;font-size:20px}
.note{color:var(--muted);font-size:14px;margin:8px 0}
.factoring{font-size:18px;margin:12px 0 4px;line-height:2.1;overflow-wrap:anywhere}
.fac{display:inline-block;border-radius:8px;padding:0 8px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--panel));margin:0 2px}
.base{--c:var(--teal)} .ext{--c:var(--purple)} .fat{--c:var(--coral)}
.crt{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:8px 0 0}
.crt::before,.crt::after{content:"";flex:1;height:1px;background:var(--line)}
.arrowrow{text-align:center;color:var(--muted);line-height:1;font-size:20px;margin:2px 0 4px}
.pieces{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px 8px}
.times{align-self:center;color:var(--muted);font-size:22px;padding:0 2px}
.card{position:relative;flex:1 1 190px;max-width:100%;border:1.5px solid var(--c);border-top-width:5px;border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--c) 7%,var(--panel));transition:box-shadow .15s}
.card.hit{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}
.card .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:600}
.card .rn{font-size:21px;margin:2px 0 4px;overflow-wrap:anywhere}
.card p{margin:3px 0;font-size:13px;color:var(--muted)}
.card p b{color:var(--fg);font-weight:500}
.card .crd{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
.card .more{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
.card .more>summary{cursor:pointer;color:var(--c);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;gap:8px;list-style:none}
.card .more>summary::-webkit-details-marker{display:none}
.card .more>summary::before{content:"\25B8";display:inline-block;transition:transform .15s}
.card .more[open]>summary::before{transform:rotate(90deg)}
.card .more .mb{font-size:14px;line-height:1.55;max-width:68ch}
.card .more .mb h4{margin:12px 0 2px;font:600 12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.card .more .mb p,.card .more .mb li{font-size:14px;color:var(--fg);margin:3px 0}
.card .more .mb ul{margin:3px 0;padding-left:20px}
.card .more .mb .mh{font:600 18px/1.3 var(--font-display);margin:4px 0 0;overflow-wrap:anywhere}
.card .more .mb .big{margin:8px 0;padding:8px 8px;border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--panel));overflow-wrap:anywhere}
.card .more .mb .note{font-size:13px;color:var(--muted)}
.m{font-family:var(--font-display);font-style:italic}
@media (min-width:561px){ .card:has(.more[open]){flex-basis:100%} }
.part{border:1px solid var(--line);border-radius:12px;padding:8px 12px 12px;margin:12px 0;background:var(--soft)}
.part .parthead{font-size:16px;margin:0 0 2px;overflow-wrap:anywhere}
.part .factoring{margin-top:8px}
.split{margin:12px 0 0;font-size:16px;overflow-wrap:anywhere}
.iso{margin-top:16px;padding:8px 16px;background:var(--soft);border-radius:12px;font-size:18px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.badge{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 12px;font-size:14px}
.badge b{font-weight:600}
.badge.yes{border-color:var(--teal)}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.facts .expr{display:block;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin:2px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px;background:var(--c);border:1px solid var(--c)}
.legend .base i,.legend .ext i,.legend .fat i{background:var(--c)}
.legend .lu{--c:var(--u)} .legend .lz{--c:var(--zd)} .legend .ln{--c:var(--nil)} .legend .l0{--c:var(--zero)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tw,54px),1fr));gap:4px}
.tile{--c:var(--zero);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--panel));border-radius:8px;padding:3px 2px;min-height:38px;font:11px/1.2 var(--font-mono);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:var(--fg)}
.tile.u{--c:var(--u)} .tile.d{--c:var(--zd)} .tile.n{--c:var(--nil)} .tile.z{--c:var(--zero)}
.tile.dim{opacity:.38}
.tile.reach{outline:2.5px solid var(--accent);outline-offset:1px;opacity:1}
.tile.sel{outline:3px solid var(--fg);outline-offset:1px;opacity:1;background:color-mix(in srgb,var(--c) 45%,var(--panel))}
.detail{margin-top:16px;padding:12px 16px;background:var(--soft);border-radius:12px;font-size:14px}
.detail p{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 9px;font:12px/1.6 var(--font-mono)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.plot svg{width:100%;height:auto;max-height:520px;display:block}
.plot .ax{stroke:var(--muted);stroke-width:1.2}
.plot .gr{stroke:var(--line);stroke-width:1}
.plot text{fill:var(--muted);font:11px var(--font-body)}
.plot .root{--c:var(--teal);transition:opacity .15s}
.plot .root.ext{--c:var(--purple)} .plot .root.fat{--c:var(--coral)} .plot .root.base{--c:var(--teal)}
.plot .root.dim{opacity:.2}
.plot .root circle{stroke:var(--c);fill:none;stroke-width:2}
.plot .root circle.dot{fill:var(--c)}
.plot .root text{fill:var(--c);font-weight:600;font-size:12px}
.special{font-size:18px}
.special .big{font:600 24px/1.2 var(--font-display);margin-bottom:8px}
@media (max-width:560px){
  .wrap{padding:16px 16px 40px}
  .egrid{--tw:44px}
  .tile{font-size:9px;min-height:34px}
  .fline{font-size:16px}
  .card{flex-basis:100%}
  .times{width:100%;text-align:center;padding:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

<div class="wrap">
  <header>
    <a class="back-link" href="../index.html">← All widgets</a>
    <h1>Quotient rings</h1>
    <p class="lede">Choose a base ring R and type a polynomial f: this page shows what R[x]/(f) really is, as a product of simpler rings, and lets you poke at its elements.</p>
  </header>

  <section class="panel">
    <div class="row">
      <div class="seg" role="group" aria-label="Base ring">
        <button type="button" data-ring="Fp" aria-pressed="true">F<sub>p</sub></button>
        <button type="button" data-ring="R" aria-pressed="false">ℝ</button>
        <button type="button" data-ring="C" aria-pressed="false">ℂ</button>
        <button type="button" data-ring="Zn" aria-pressed="false">ℤ/n</button>
      </div>
      <label id="primeWrap">prime p <select id="prime" aria-label="Prime p"></select></label>
      <label id="nWrap" style="display:none">modulus n <select id="nsel" aria-label="Modulus n"></select></label>
    </div>
    <div class="fline"><span class="pre" id="pre"></span><input type="text" id="f" aria-label="Polynomial f" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. (x+1)^2(x^2+1)"><span>)</span></div>
    <div class="keys" id="keys"></div>
    <div class="err" id="err" role="alert"></div>
    <div class="presets" id="presets"></div>
  </section>

  <div id="out"></div>
</div>

<script>
/* ===================== ENGINE (pure, no DOM) ===================== */
"use strict";
const QR = (function(){
class QErr extends Error{}
const fail = m => { throw new QErr(m); };

/* ---- exact rationals (BigInt) ---- */
function bgcd(a,b){ if(a<0n)a=-a; if(b<0n)b=-b; while(b){ const t=a%b; a=b; b=t; } return a; }
function Q(n,d){ if(d===undefined)d=1n; if(d===0n) throw new Error('zero denominator'); if(d<0n){n=-n;d=-d;} const g=bgcd(n,d); if(g>1n){n/=g;d/=g;} return {n,d}; }
const Q0=Q(0n), Q1=Q(1n);
const qadd=(a,b)=>Q(a.n*b.d+b.n*a.d,a.d*b.d);
const qsub=(a,b)=>Q(a.n*b.d-b.n*a.d,a.d*b.d);
const qmul=(a,b)=>Q(a.n*b.n,a.d*b.d);
const qinv=a=>{ if(a.n===0n) throw new Error('inverse of 0'); return Q(a.d,a.n); };
const qneg=a=>({n:-a.n,d:a.d});
const qz=a=>a.n===0n;
const qeq=(a,b)=>a.n===b.n&&a.d===b.d;
const qabs=a=>a.n<0n?qneg(a):a;
function qfloat(a){
  const neg=a.n<0n, n=neg?-a.n:a.n;
  if(n.toString(2).length<1000 && a.d.toString(2).length<1000) return (neg?-1:1)*Number(n)/Number(a.d);
  return (neg?-1:1)*Number((n*10n**30n)/a.d)/1e30;
}
function qstr(a){ return a.d===1n ? a.n.toString() : a.n.toString()+'/'+a.d.toString(); }
const FQ={zero:Q0,one:Q1,add:qadd,sub:qsub,mul:qmul,neg:qneg,inv:qinv,isZero:qz,eq:qeq,fromInt:n=>Q(BigInt(n))};

/* ---- Gaussian rationals Q(i) ---- */
const C=(r,i)=>({r:r||Q0,i:i||Q0});
const FC={
  zero:C(Q0,Q0), one:C(Q1,Q0),
  add:(a,b)=>C(qadd(a.r,b.r),qadd(a.i,b.i)),
  sub:(a,b)=>C(qsub(a.r,b.r),qsub(a.i,b.i)),
  mul:(a,b)=>C(qsub(qmul(a.r,b.r),qmul(a.i,b.i)),qadd(qmul(a.r,b.i),qmul(a.i,b.r))),
  neg:a=>C(qneg(a.r),qneg(a.i)),
  inv:a=>{ const n=qadd(qmul(a.r,a.r),qmul(a.i,a.i)); if(qz(n)) throw new Error('inverse of 0'); const k=qinv(n); return C(qmul(a.r,k),qneg(qmul(a.i,k))); },
  isZero:a=>qz(a.r)&&qz(a.i),
  eq:(a,b)=>qeq(a.r,b.r)&&qeq(a.i,b.i),
  fromInt:n=>C(Q(BigInt(n)),Q0)
};

/* ---- F_p ---- */
const fpCache={};
function makeFp(p){
  const inv=new Array(p).fill(0);
  for(let a=1;a<p;a++) for(let b=1;b<p;b++) if(a*b%p===1) inv[a]=b;
  return {p,zero:0,one:1,add:(a,b)=>(a+b)%p,sub:(a,b)=>(a-b+p)%p,mul:(a,b)=>a*b%p,neg:a=>(p-a)%p,inv:a=>inv[a],isZero:a=>a===0,eq:(a,b)=>a===b,fromInt:n=>((n%p)+p)%p};
}

/* ---- generic polynomials over a field F (arrays, low degree first, trimmed) ---- */
function makePoly(F){
  const trim=a=>{ let n=a.length; while(n>0&&F.isZero(a[n-1])) n--; return n===a.length?a:a.slice(0,n); };
  const deg=a=>trim(a).length-1;
  const add=(a,b)=>{ const n=Math.max(a.length,b.length), r=[]; for(let k=0;k<n;k++) r.push(F.add(k<a.length?a[k]:F.zero,k<b.length?b[k]:F.zero)); return trim(r); };
  const sub=(a,b)=>{ const n=Math.max(a.length,b.length), r=[]; for(let k=0;k<n;k++) r.push(F.sub(k<a.length?a[k]:F.zero,k<b.length?b[k]:F.zero)); return trim(r); };
  const mul=(a,b)=>{ a=trim(a); b=trim(b); if(!a.length||!b.length) return []; const r=new Array(a.length+b.length-1).fill(F.zero); for(let i=0;i<a.length;i++) for(let j=0;j<b.length;j++) r[i+j]=F.add(r[i+j],F.mul(a[i],b[j])); return trim(r); };
  const scale=(a,c)=>trim(a.map(x=>F.mul(x,c)));
  const divmod=(a,b)=>{
    a=trim(a); b=trim(b); if(!b.length) throw new Error('division by zero polynomial');
    const db=b.length-1, il=F.inv(b[db]); const r=a.slice();
    const q=new Array(Math.max(0,a.length-db)).fill(F.zero);
    for(let k=r.length-1;k>=db;k--){
      if(F.isZero(r[k])) continue;
      const c=F.mul(r[k],il); q[k-db]=c;
      for(let j=0;j<=db;j++) r[k-db+j]=F.sub(r[k-db+j],F.mul(c,b[j]));
    }
    return [trim(q),trim(r.slice(0,db))];
  };
  const rem=(a,b)=>divmod(a,b)[1];
  const monic=a=>{ a=trim(a); if(!a.length) return a; const il=F.inv(a[a.length-1]); return a.map(x=>F.mul(x,il)); };
  const gcd=(a,b)=>{ a=trim(a); b=trim(b); while(b.length){ const t=rem(a,b); a=b; b=t; } return monic(a); };
  const deriv=a=>trim(a.slice(1).map((c,k)=>F.mul(c,F.fromInt(k+1))));
  const ev=(a,x)=>{ let r=F.zero; for(let k=a.length-1;k>=0;k--) r=F.add(F.mul(r,x),a[k]); return r; };
  const pow=(a,e)=>{ let r=[F.one]; for(let k=0;k<e;k++) r=mul(r,a); return r; };
  const powmod=(a,e,m)=>{ let r=[F.one], b=rem(a,m); while(e>0n){ if(e&1n) r=rem(mul(r,b),m); b=rem(mul(b,b),m); e>>=1n; } return r; };
  const eq=(a,b)=>{ a=trim(a); b=trim(b); if(a.length!==b.length) return false; for(let k=0;k<a.length;k++) if(!F.eq(a[k],b[k])) return false; return true; };
  return {F,trim,deg,add,sub,mul,scale,divmod,rem,monic,gcd,deriv,ev,pow,powmod,eq};
}
const PQ=makePoly(FQ), PC=makePoly(FC);
function getFp(p){ if(!fpCache[p]){ const F=makeFp(p); fpCache[p]=makePoly(F); } return fpCache[p]; }

/* ===================== parser ===================== */
const SUPMAP={'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9};
function tokenize(src){
  const s=src.replace(/[−–—‒]/g,'-').replace(/[×·⋅∗]/g,'*').replace(/ /g,' ');
  const toks=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){ i++; continue; }
    if(/[0-9.]/.test(c)){
      const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
      if(!m) fail("A lone '.' isn't a number.");
      const t=m[1]; let v;
      if(t.indexOf('.')>=0){ const [a,b]=t.split('.'); v=Q(BigInt((a||'0')+(b||'')),10n**BigInt((b||'').length)); }
      else v=Q(BigInt(t));
      toks.push({t:'num',v,s:t,pos:i}); i+=t.length; continue;
    }
    if(c in SUPMAP){ let n=0,j=i; while(j<s.length&&(s[j] in SUPMAP)){ n=n*10+SUPMAP[s[j]]; j++; if(n>100000) fail('That exponent is too large.'); } toks.push({t:'sup',v:n,pos:i}); i=j; continue; }
    if(c==='⁻') fail('Exponents must be non-negative whole numbers.');
    if(c==='x'||c==='X'){ toks.push({t:'x',pos:i}); i++; continue; }
    if(c==='i'){ toks.push({t:'i',pos:i}); i++; continue; }
    if(c==='*'&&s[i+1]==='*'){ toks.push({t:'^',pos:i}); i+=2; continue; }
    if('+-*/^()'.indexOf(c)>=0){ toks.push({t:c,pos:i}); i++; continue; }
    if(c==='['||c==='{') { toks.push({t:'(',pos:i}); i++; continue; }
